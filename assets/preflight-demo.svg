<svg xmlns="http://www.w3.org/2000/svg" width="882" height="1010" viewBox="0 0 882 1010" role="img" aria-labelledby="t d">
<title id="t">otelwrench preflight on the bundled synthetic exporter upgrade</title>
<desc id="d">Terminal output of otelwrench preflight on examples/preflight: three families renamed by the OTLP-to-Prometheus suffix rules (one rescaled from milliseconds to seconds), a renamed label, a removed family, a type change, a new label and the series growth it causes, the dashboard panels and alerts each one breaks, the follow-up command per finding, and the verdict: 9 of 14 queries affected, exit 1. Generated by assets/render_terminal.py.</desc>
<style>text{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace;font-size:13px;fill:#d9dde3;white-space:pre}.b{font-weight:700;fill:#ffffff}.d{fill:#8a919c}.c31{fill:#ff7b72}.c32{fill:#7ee787}.c33{fill:#e3b341}.c34{fill:#79c0ff}.c35{fill:#d2a8ff}.c36{fill:#b3a4ff}.title{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;font-size:12px;fill:#8a919c}</style>
<rect x="0.5" y="0.5" width="881" height="1009" rx="10" fill="#14171c" stroke="#3a404a"/>
<path d="M0.5 32 V10.5 a10 10 0 0 1 10 -10 H871.5 a10 10 0 0 1 10 10 V32 Z" fill="#1d2128"/>
<line x1="0.5" y1="32" x2="881.5" y2="32" stroke="#3a404a"/>
<circle cx="20" cy="16.0" r="5.5" fill="#ff5f57"/>
<circle cx="38" cy="16.0" r="5.5" fill="#febc2e"/>
<circle cx="56" cy="16.0" r="5.5" fill="#28c840"/>
<text class="title" x="441.0" y="20.0" text-anchor="middle">examples/preflight  —  fictional exporter upgrade, synthetic data, offline</text>
<text y="59" xml:space="preserve"><tspan x="18.0" class="b c32">$</tspan><tspan x="33.7" class="b">otelwrench preflight before.prom after.prom --queries checkout-dashboard.json --queries checkout-alerts.yaml</tspan></text>
<text y="76" xml:space="preserve"><tspan x="18.0" class="b">otelwrench preflight</tspan><tspan x="190.3">before.prom -&gt; after.prom</tspan></text>
<text y="93" xml:space="preserve"><tspan x="33.7" class="d">27 -&gt; 45 series (+66.7%) · 8 -&gt; 7 families · 14 dashboard and alert queries</tspan></text>
<text y="127" xml:space="preserve"><tspan x="18.0" class="c31">✗</tspan><tspan x="33.7" class="b">Renamed by the OTLP-to-Prometheus naming rules</tspan><tspan x="409.5" class="d">prom-names</tspan></text>
<text y="144" xml:space="preserve"><tspan x="49.3">checkout_orders -&gt; checkout_orders_total</tspan><tspan x="511.3" class="d">counter, counter _total suffix</tspan></text>
<text y="161" xml:space="preserve"><tspan x="65.0" class="c31">breaks</tspan><tspan x="127.6">Orders per minute · checkout:orders:rate5m</tspan></text>
<text y="178" xml:space="preserve"><tspan x="49.3">http_server_duration -&gt; http_server_duration_milliseconds</tspan><tspan x="511.3" class="d">histogram, OTLP unit "ms" suffix</tspan></text>
<text y="195" xml:space="preserve"><tspan x="65.0" class="c31">breaks</tspan><tspan x="127.6">p95 latency by route · CheckoutLatencyHigh</tspan></text>
<text y="212" xml:space="preserve"><tspan x="49.3">queue_wait_milliseconds -&gt; queue_wait_seconds</tspan><tspan x="511.3" class="d">gauge, ms to s: values x0.001</tspan></text>
<text y="229" xml:space="preserve"><tspan x="65.0" class="c31">breaks</tspan><tspan x="127.6">QueueBacklog</tspan></text>
<text y="246" xml:space="preserve"><tspan x="65.0" class="c33">note</tspan><tspan x="127.6">Values are now seconds, not milliseconds: rename the series in queries and scale thresholds by</tspan></text>
<text y="263" xml:space="preserve"><tspan x="96.3">0.001 (500 becomes 0.5).</tspan></text>
<text y="280" xml:space="preserve"><tspan x="49.3" class="d">fix</tspan><tspan x="112.0">Update queries to the new name, or turn suffixes off in the exporter</tspan></text>
<text y="297" xml:space="preserve"><tspan x="80.6">(UnderscoreEscapingWithoutSuffixes).</tspan></text>
<text y="314" xml:space="preserve"><tspan x="49.3" class="d">next</tspan><tspan x="112.0" class="c36">otelwrench preflight before.prom after.prom --emit rename-map &gt; renames.json</tspan></text>
<text y="331" xml:space="preserve"><tspan x="112.0" class="c36">otelwrench promdiff before.prom after.prom --rename-map renames.json</tspan></text>
<text y="365" xml:space="preserve"><tspan x="18.0" class="c31">✗</tspan><tspan x="33.7" class="b">Label renamed</tspan><tspan x="151.1" class="d">promdiff + cardinality</tspan></text>
<text y="382" xml:space="preserve"><tspan x="49.3">http_client_requests_total: status_code -&gt; http_response_status_code</tspan><tspan x="597.4" class="d">same 2 observed values</tspan></text>
<text y="399" xml:space="preserve"><tspan x="65.0" class="c31">breaks</tspan><tspan x="127.6">Payment responses by status · PaymentsErrorRate</tspan></text>
<text y="416" xml:space="preserve"><tspan x="49.3" class="d">fix</tspan><tspan x="112.0">Update by(...) and selector uses of status_code to http_response_status_code.</tspan></text>
<text y="433" xml:space="preserve"><tspan x="49.3" class="d">next</tspan><tspan x="112.0" class="d">same commands as above</tspan></text>
<text y="467" xml:space="preserve"><tspan x="18.0" class="c31">✗</tspan><tspan x="33.7" class="b">Family removed</tspan><tspan x="158.9" class="d">promdiff</tspan></text>
<text y="484" xml:space="preserve"><tspan x="49.3">runtime_gc_pause_seconds</tspan><tspan x="252.9" class="d">summary, 4 series</tspan></text>
<text y="501" xml:space="preserve"><tspan x="65.0" class="c31">breaks</tspan><tspan x="127.6">GC pause p99</tspan></text>
<text y="518" xml:space="preserve"><tspan x="49.3" class="d">fix</tspan><tspan x="112.0">Restore it in the exporter, or delete the panels and alerts that read it and accept the change.</tspan></text>
<text y="535" xml:space="preserve"><tspan x="49.3" class="d">next</tspan><tspan x="112.0" class="c36">otelwrench preflight before.prom after.prom --emit allowlist &gt; allowlist.json</tspan></text>
<text y="552" xml:space="preserve"><tspan x="112.0" class="c36">otelwrench promdiff before.prom after.prom --rename-map renames.json --allowlist allowlist.json</tspan></text>
<text y="586" xml:space="preserve"><tspan x="18.0" class="c31">✗</tspan><tspan x="33.7" class="b">Type changed</tspan><tspan x="143.3" class="d">promdiff</tspan></text>
<text y="603" xml:space="preserve"><tspan x="49.3">worker_jobs_active: counter -&gt; gauge</tspan></text>
<text y="620" xml:space="preserve"><tspan x="65.0" class="c31">breaks</tspan><tspan x="127.6">Worker job starts</tspan></text>
<text y="637" xml:space="preserve"><tspan x="49.3" class="d">fix</tspan><tspan x="112.0">rate()/increase() over a gauge is meaningless: graph the value or use *_over_time().</tspan></text>
<text y="654" xml:space="preserve"><tspan x="49.3" class="d">next</tspan><tspan x="112.0" class="d">same commands as above</tspan></text>
<text y="688" xml:space="preserve"><tspan x="18.0" class="c31">✗</tspan><tspan x="33.7" class="b">Label set changed</tspan><tspan x="182.4" class="d">promdiff</tspan></text>
<text y="705" xml:space="preserve"><tspan x="49.3">rpc_client_calls_total: +net_sock_peer_port</tspan></text>
<text y="722" xml:space="preserve"><tspan x="49.3" class="d">fix</tspan><tspan x="112.0">New label net_sock_peer_port: check joins, without(...) and recording rules.</tspan></text>
<text y="739" xml:space="preserve"><tspan x="49.3" class="d">next</tspan><tspan x="112.0" class="d">same commands as above</tspan></text>
<text y="773" xml:space="preserve"><tspan x="18.0" class="c31">✗</tspan><tspan x="33.7" class="b">Series growth over budget</tspan><tspan x="245.1" class="d">promdiff + cardinality</tspan></text>
<text y="790" xml:space="preserve"><tspan x="49.3">27 -&gt; 45 series (+66.7%), budget 20%</tspan></text>
<text y="807" xml:space="preserve"><tspan x="49.3">rpc_client_calls_total 2 -&gt; 24 series:</tspan><tspan x="354.7" class="b">net_sock_peer_port</tspan><tspan x="503.5">0 -&gt; 12 values</tspan></text>
<text y="824" xml:space="preserve"><tspan x="65.0" class="d">dropping net_sock_peer_port by relabeling merges 24 series into 2 (2 collision groups): aggregate it</tspan></text>
<text y="841" xml:space="preserve"><tspan x="96.3" class="d">away at the source (SDK view or Collector processor)</tspan></text>
<text y="858" xml:space="preserve"><tspan x="49.3" class="d">next</tspan><tspan x="112.0" class="c36">otelwrench cardinality after.prom --drop-labels net_sock_peer_port --metric</tspan></text>
<text y="875" xml:space="preserve"><tspan x="80.6" class="c36">rpc_client_calls_total</tspan></text>
<text y="909" xml:space="preserve"><tspan x="18.0" class="c33">!</tspan><tspan x="33.7" class="b">2 more changes</tspan><tspan x="158.9" class="d">rpc_client_calls_total 24 new series · rpc_client_calls_total 2 series gone</tspan></text>
<text y="926" xml:space="preserve"><tspan x="49.3" class="d">next</tspan><tspan x="112.0" class="c36">otelwrench promdiff before.prom after.prom --rename-map renames.json</tspan></text>
<text y="960" xml:space="preserve"><tspan x="18.0" class="c31">9 of 14 queries</tspan><tspan x="143.3">read something that changed: 3 of 4 alerts, 5 of 8 dashboard panels, 1 of 2 recording rules.</tspan></text>
<text y="977" xml:space="preserve"><tspan x="18.0" class="d">Both captures parse as Prometheus text 0.0.4, so the scrape itself still succeeds.</tspan></text>
<text y="994" xml:space="preserve"><tspan x="18.0" class="c31">FAIL (exit 1)</tspan><tspan x="119.8">: 8 errors, 2 warnings</tspan><tspan x="307.7" class="d">--fail-on error</tspan></text>
</svg>
