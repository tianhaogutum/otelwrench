# Explicit policy: retain service label, demote pods, drop selected attributes.
limits_config:
  otlp_config:
    resource_attributes:
      ignore_defaults: true
      attributes_config:
        - action: index_label
          attributes: [service.name]
        - action: drop
          attributes: [shared.key]
    scope_attributes:
      - action: drop
        attributes: [component, shared_key]
    log_attributes:
      - action: drop
        attributes: [debug.secret, shared-key]
