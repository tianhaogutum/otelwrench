groups:
  - name: checkout-api
    rules:
      - alert: CheckoutLatencyHigh
        expr: histogram_quantile(0.95, sum by (le) (rate(http_server_duration_bucket{http_route="/checkout"}[5m]))) > 250
        for: 10m
      - alert: QueueBacklog
        expr: max by (queue) (queue_wait_milliseconds) > 500
        for: 5m
      - alert: PaymentsErrorRate
        expr: |
          sum(rate(http_client_requests_total{peer="payments", status_code=~"5.."}[5m]))
            / sum(rate(http_client_requests_total{peer="payments"}[5m])) > 0.05
        for: 5m
      - alert: MemoryHigh
        expr: process_resident_memory_bytes > 1.5e9
        for: 15m
      - record: checkout:orders:rate5m
        expr: sum by (payment) (rate(checkout_orders[5m]))
      - record: inventory:rpc_calls:rate5m
        expr: sum by (rpc_service) (rate(rpc_client_calls_total[5m]))
