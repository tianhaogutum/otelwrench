[build-system]
requires = ["hatchling>=1.27", "hatch-fancy-pypi-readme>=24.1"]
build-backend = "hatchling.build"

[project]
name = "otelwrench"
version = "0.1.0"
description = "Catch the telemetry change that scrapes fine and silently breaks your dashboards and alerts. Offline CLI for OpenTelemetry and Prometheus pipelines."
# README.md with repository-relative links rewritten for PyPI (see tool.hatch.metadata.hooks below).
dynamic = ["readme"]
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY.md", "licenses/*"]
authors = [{ name = "tianhaogutum" }]
keywords = [
    "opentelemetry", "otlp", "prometheus", "observability", "tracing", "metrics",
    "jaeger", "zipkin", "loki", "sentry", "tail-sampling", "spanmetrics",
    "cardinality", "alerting", "promql", "grafana", "ci", "collector", "redaction",
    "privacy",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    "Topic :: System :: Logging",
    "Topic :: System :: Monitoring",
    "Topic :: Utilities",
]
dependencies = [
    # prom-names (exposition self-check), promdiff (exposition parser)
    "prometheus-client>=0.25.0",
    # loki (mapping profiles), tailsim (sampling policies)
    "PyYAML>=6.0.3",
    # loki: Loki matches attribute selectors with RE2 semantics; Python's re is not a safe substitute.
    "google-re2>=1.1.20251105",
]

[project.optional-dependencies]
# privacy: diffs, RFC 6901 pointers and JSONPath over real Collector output, plus the official
# OTLP protobuf classes for ingestion audits. The Collector binary itself is never bundled or
# downloaded at install time (see docs/privacy.md).
privacy = [
    "deepdiff>=8.6.1",
    "jsonpointer>=3.0.0",
    "jsonpath-ng>=1.7.0",
    "opentelemetry-proto>=1.38.0",
]
# Test runner plus the privacy extra; everything else the tests import is a core dependency.
test = [
    "pytest>=9.0.2",
    "deepdiff>=8.6.1",
    "jsonpointer>=3.0.0",
    "jsonpath-ng>=1.7.0",
    "opentelemetry-proto>=1.38.0",
]

[project.urls]
Homepage = "https://github.com/tianhaogutum/otelwrench"
Repository = "https://github.com/tianhaogutum/otelwrench"
Issues = "https://github.com/tianhaogutum/otelwrench/issues"
Documentation = "https://github.com/tianhaogutum/otelwrench/blob/main/docs/README.md"

[project.scripts]
otelwrench = "otelwrench.cli:main"

# PyPI cannot resolve repository-relative links or images: rewrite them to GitHub URLs.
[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
# <img src>, <source srcset>: raw file URLs so the images render
pattern = '(src|srcset)="(?!https?://)([^"]+)"'
replacement = '\1="https://raw.githubusercontent.com/tianhaogutum/otelwrench/main/\2"'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = 'href="(?!https?://|#|mailto:)([^"]+)"'
replacement = 'href="https://github.com/tianhaogutum/otelwrench/blob/main/\1"'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
# Markdown images, then Markdown links to files and directories
pattern = '!\[([^\]]*)\]\((?!https?://)([^)\s]+)\)'
replacement = '![\1](https://raw.githubusercontent.com/tianhaogutum/otelwrench/main/\2)'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '\]\((?!https?://|#|mailto:)([^)\s]+)\)'
replacement = '](https://github.com/tianhaogutum/otelwrench/blob/main/\1)'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
# In-page anchors: PyPI does not generate heading ids
pattern = '\]\(#([^)\s]+)\)'
replacement = '](https://github.com/tianhaogutum/otelwrench#\1)'

[tool.hatch.build.targets.wheel]
# Runtime data files inside the package are shipped with it: loki/defaults.json.
# privacy has no data files; its Collector binary is supplied by the user.
packages = ["src/otelwrench"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/docs",
    "/examples",
    "/benchmarks",
    "/licenses",
    "/README.md",
    "/README.zh-CN.md",
    "/assets",
    "/LICENSE",
    "/NOTICE",
    "/THIRD_PARTY.md",
    "/pyproject.toml",
]
exclude = [
    "__pycache__",
    "*.py[cod]",
    ".cache",
    ".artifacts",
    ".pytest_cache",
    ".ruff_cache",
    ".DS_Store",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra"]
markers = ["integration: runs a locally installed, pinned OpenTelemetry Collector (privacy); skipped when absent"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# Correctness-focused set; the merged tools keep their original compact style.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Test modules re-export fixtures and helpers across sibling modules and keep a compact style.
"tests/**" = ["F401", "F811", "F841", "E402", "E701", "E702", "E731"]
# Demo and benchmark scripts keep the original tools' compact one-line style.
"examples/**" = ["F841", "E701", "E702"]
"benchmarks/**" = ["F841", "E701", "E702"]
